# Ruff configuration for the Vision3D AI backend.
# `ruff check` enforces correctness + imports + basic style.
line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # FastAPI relies on mutable default sentinels like Depends()/File()
    "B008",
    # Project deliberately uses typing.Optional & typing.List for Python 3.10 compat
    "UP045",
    "UP006",
    "UP035",
    "UP037",
    # Broad exception clauses during defensive AI pipeline guards
    "BLE001",
    # False-positive unneeded-noqa from starlette stubs
    "RUF100",
    "RUF059",
    "RUF022",
    "RUF012",
    "RUF013",
    "RUF019",
    # 110-char line length
    "E501",
]

[lint.per-file-ignores]
"tests/*" = ["E999"]
"*/_test*.py" = ["E999"]

[format]
quote-style = "double"