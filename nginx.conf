# ---- Vision3D AI - production edge reverse proxy -----------------------------
# Mounted into the `nginx` service in docker-compose.prod.yml.
#   * /api/*        -> backend:8000
#   * everything    -> frontend:80 (static SPA)
# Terminates TLS (certs mounted at /etc/nginx/certs), rate-limits the API,
# and forwards client IPs so the backend rate limiter sees real addresses.

# In-memory rate limit zone: defense-in-depth on top of the app-level slowapi
# limits (auth/upload). Bump the bucket for busy deployments.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=300r/m;

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # --- TLS (Let's Encrypt / certbot or self-signed for testing) -------------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # --- Uploads / GLB downloads ----------------------------------------------
    client_max_body_size 20m;

    # --- Compression -----------------------------------------------------------
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml model/gltf-binary model/gltf+json;

    # --- Security headers -------------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- API -------------------------------------------------------------------
    # ^~ makes this prefix win over the static-asset regex below, so GLB/OBJ
    # downloads under /api/v1/files/*.glb always reach the backend.
    location ^~ /api/ {
        limit_req zone=api_limit burst=150 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Long-running AI generation / polling requests.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    # --- Static assets (long cache) ---------------------------------------------
    location ~* \.(glb|gltf|png|jpe?g|webp|js|css|svg|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        proxy_pass http://frontend_upstream;
    }

    # --- SPA ---------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
