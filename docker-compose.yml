# ---- Vision3D AI - LOCAL DEVELOPMENT -----------------------------------------
# Usage:
#   docker compose up -d --build            (or: docker compose up -d)
#   docker compose down
# With GPU inference:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# This brings up:
#   mongo     -> MongoDB 7 (persisted in a named volume)
#   backend   -> FastAPI on :8000 with hot reload (app/ mounted)
#   frontend  -> Vite dev server on :5173 with hot reload (src/ mounted)

name: vision3d

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: vision3d
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend/app:/app/app
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      # Direct API origin from the browser (Vite loads VITE_* from process env).
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_APP_NAME: "Vision3D AI"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mongo_data:
  frontend_node_modules: